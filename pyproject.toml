[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iris"
version = "0.2.0"
description = "Machine-learning matching for entity matching, on one machine or a Spark cluster."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "joblib>=1.3",
    "mmh3>=3.0",
    "numba>=0.60",
    "numpy>=1.26,<2.1",
    "pandas>=2.2",
    "py_stringmatching>=0.4.7",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "threadpoolctl>=3.1",
    "tqdm>=4.64",
    "xgboost>=2.0.3,<2.1",
]

[project.optional-dependencies]
spark = [
    "pyspark>=3.5,<4",
    "setuptools>=65; python_version >= '3.12'",
]
web = [
    "flask>=2.0.0",
    "requests>=2.25.0",
    "streamlit>=1.0.0",
    "tabulate>=0.8.9",
]

[project.scripts]
iris = "iris.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
